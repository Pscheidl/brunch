name: brunch-local
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: brunch
      POSTGRES_USER: brunch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - brunch_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brunch -d brunch"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:11026:1025"
      - "127.0.0.1:18026:8025"
    restart: unless-stopped
volumes:
  brunch_postgres:
