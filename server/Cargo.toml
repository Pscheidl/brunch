[package]
name = "brunch-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "=0.8.9", features = ["macros"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync", "fs"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "0.10"
argon2 = "=0.5.3"
sha2 = { version = "=0.10.9", features = ["oid"] }
rsa = { version = "=0.9.10", features = ["pem"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
hex = "=0.4.3"
rand = "=0.8.8"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
tower-http = { version = "=0.6.11", features = ["fs", "compression-gzip", "set-header"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
dotenvy = "=0.15.7"
url = "=2.5.8"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "=0.22.1"

[dev-dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "cookies", "rustls-tls"] }

[profile.dev]
debug = 1
[profile.test]
debug = 1
