name: Frontend and backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust and WebAssembly tools
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/trunk
            target
          key: pages-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Trunk.toml') }}

      - name: Check formatting and cart calculations
        run: |
          cargo fmt --all --check
          cargo test --locked

      - name: Install Trunk 0.21.14
        env:
          TRUNK_VERSION: 0.21.14
        run: |
          mkdir -p "$RUNNER_TEMP/trunk"
          curl --fail --location --retry 3 \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/trunk.tar.gz"
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP/trunk"
          echo "$RUNNER_TEMP/trunk" >> "$GITHUB_PATH"

      - name: Verify build at the domain root
        run: |
          ./scripts/build.sh --public-url /
          python3 scripts/check-pages.py --dist dist --public-url /

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: brunch
          POSTGRES_PASSWORD: brunch-ci
          POSTGRES_DB: brunch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brunch -d brunch_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://brunch:brunch-ci@127.0.0.1:5432/brunch_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            server/target
          key: backend-${{ runner.os }}-${{ hashFiles('server/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Formatting and unit tests
        run: |
          cargo fmt --manifest-path server/Cargo.toml --check
          cargo test --locked --manifest-path server/Cargo.toml --lib
          cargo test --locked --manifest-path server/Cargo.toml --test config
      - name: PostgreSQL HTTP and SMTP integration
        run: cargo test --locked --manifest-path server/Cargo.toml --test api --test mail --test security --test administrators --test media --test payments -- --ignored --test-threads=1
      - name: Clippy
        run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
