# Private bootstrap only. Use -p brunch-preview and a separate preview.env.
# Start independently, never combine this file with production compose.yaml.
name: brunch-preview

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      BRUNCH_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, work_mem=4MB, -c, max_wal_size=512MB]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-brunch.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d brunch"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    shm_size: 128m
    mem_limit: 640m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    logging: *logging

  app:
    image: ${BRUNCH_IMAGE:?Set BRUNCH_IMAGE from the release}
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m,mode=1777]
    environment:
      APP_ENV: preview
      BIND_ADDR: 0.0.0.0:3100
      PUBLIC_URL: http://127.0.0.1:3100
      DATABASE_URL: postgres://brunch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/brunch
      DIST_DIR: /app/dist
      ADMIN_EMAIL: admin@example.test
      ORDER_EMAIL: orders@example.test
      SMTP_FROM: Brunch Era <shop@example.test>
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_PASSWORD_FILE: ""
      TEYA_ENVIRONMENT: ""
      RUST_LOG: brunch_server=info,tower_http=warn
    ports: ["127.0.0.1:3100:3100"]
    networks: [application, database, mail_capture]
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "5", http://127.0.0.1:3100/api/health]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    mem_limit: 640m
    pids_limit: 128
    stop_grace_period: 45s
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_LABEL: Brunch Era private preview
      MP_MAX_MESSAGES: "100"
      MP_MAX_AGE: 7d
      MP_MAX_MESSAGE_SIZE: "1"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_ALLOWED_HOSTS: localhost,127.0.0.1,mailpit
      MP_SMTP_RELAY_ALL: "false"
    volumes: [mailpit_data:/tmp]
    # No public or loopback ports. Access the container IP through an SSH tunnel.
    # An internal-only network has no external route and cannot relay messages.
    networks: [mail_capture]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 96m
    pids_limit: 64
    logging: *logging

networks:
  application: {}
  database:
    internal: true
  mail_capture:
    internal: true

volumes:
  postgres_data:
  mailpit_data:
