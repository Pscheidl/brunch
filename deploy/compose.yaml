name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      BRUNCH_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, work_mem=4MB, -c, max_wal_size=512MB]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-brunch.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d brunch"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    shm_size: 128m
    mem_limit: 640m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    networks: [database]
    logging: *logging

  app:
    image: ${BRUNCH_IMAGE:?Set BRUNCH_IMAGE from the release}
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV}
      BIND_ADDR: 0.0.0.0:3100
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN}
      DATABASE_URL: postgres://brunch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/brunch
      DIST_DIR: /app/dist
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ORDER_EMAIL: ${ORDER_EMAIL:?Set ORDER_EMAIL}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: "true"
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      ONLINE_PAYMENT_TIMEOUT_MINUTES: ${ONLINE_PAYMENT_TIMEOUT_MINUTES:-60}
      TEYA_ENVIRONMENT: ${TEYA_ENVIRONMENT:-}
      TEYA_STORE_ID: ${TEYA_STORE_ID:-}
      TEYA_CLIENT_ID: ${TEYA_CLIENT_ID:-}
      TEYA_CLIENT_SECRET_FILE: ${TEYA_CLIENT_SECRET_FILE:-}
      TEYA_WEBHOOK_PUBLIC_KEY_FILE: ${TEYA_WEBHOOK_PUBLIC_KEY_FILE:-}
      TEYA_WEBHOOK_PREVIOUS_PUBLIC_KEY_FILE: ${TEYA_WEBHOOK_PREVIOUS_PUBLIC_KEY_FILE:-}
      RUST_LOG: brunch_server=info,tower_http=warn
    volumes:
      - type: bind
        source: ${SECRETS_DIR:-/etc/brunch/secrets}
        target: /run/brunch-secrets
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "5", http://127.0.0.1:3100/api/health]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    mem_limit: 640m
    pids_limit: 128
    stop_grace_period: 45s
    networks: [database, application]
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    networks: [application]
    logging: *logging

networks:
  database:
    internal: true
  application: {}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
